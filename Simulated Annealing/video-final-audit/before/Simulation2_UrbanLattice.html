<script id="model">
const Simulation02 = (() => {
  'use strict';
  const AUTO_PLAY = false, RECORDING_MODE = true, RANDOM_SEED = 20260912;
  const CONFIG = Object.freeze({width:1920, height:1080, duration:14, dt:1/120,
    proposalRate:24, proposalAmplitude:0.12, minSignal:0.20, maxSignal:0.80,
    temperatureEnd:0.90, cycle:4.8, delayReference:.25, seed:RANDOM_SEED});
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const mix = (a,b,t) => a+(b-a)*t;
  const smooth = (a,b,x) => {const u=clamp((x-a)/(b-a),0,1); return u*u*(3-2*u);};
  const assert = (ok,message) => {if(!ok) throw new Error(message);};
  const deepFreeze = o => {Object.values(o).forEach(v => {if(v && typeof v==='object') deepFreeze(v);}); return Object.freeze(o);};
  // Geometry is explicit, synthetic and not georeferenced. Keep this schema for scene 04.
  const NETWORK_CONFIG = deepFreeze({version:1, geometrySeed:20260912,
    nodes:[[110,104],[366,72],[664,116],[977,94],[146,260],[426,245],[720,277],[1040,231],
      [88,434],[337,409],[652,443],[993,411],[194,596],[448,574],[770,614],[1064,564]],
    // a,b,axis (0=main / 1=cross), relative demand, base capacity, main corridor
    edges:[[0,1,0,.49,.91,1],[1,2,0,.51,.92,1],[2,3,0,.48,.90,1],
      [4,5,0,.57,.96,1],[5,6,0,.58,.94,1],[6,7,0,.54,.95,1],
      [8,9,0,.53,.93,1],[9,10,0,.55,.94,1],[10,11,0,.52,.94,1],
      [12,13,0,.47,.93,0],[13,14,0,.48,.95,0],[14,15,0,.46,.92,0],
      [0,4,1,.38,.78,0],[4,8,1,.40,.78,0],[8,12,1,.25,.83,0],
      [1,5,1,.42,.79,0],[5,9,1,.41,.79,0],[9,13,1,.39,.80,0],
      [2,6,1,.41,.77,0],[6,10,1,.42,.80,0],[10,14,1,.39,.80,0],
      [3,7,1,.26,.83,0],[7,11,1,.40,.80,0],[11,15,1,.24,.82,0],
      [1,4,1,.38,.82,0],[10,15,0,.40,.89,0]],
    offsets:[.07,.64,.26,.82,.41,.92,.16,.56,.77,.31,.95,.11,.52,.03,.69,.38]});
  const INITIAL_STATE = deepFreeze([.39,.51,.34,.48,.42,.30,.43,.36,.35,.49,.38,.46,.47,.33,.50,.41]);
  class PRNG {
    constructor(seed){this.state=seed>>>0;}
    next(){let t=this.state=(this.state+0x6D2B79F5)>>>0;t=Math.imul(t^(t>>>15),t|1);
      t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;}
  }
  class UrbanNetwork {
    constructor(){this.nodes=NETWORK_CONFIG.nodes.map(([x,y],id)=>({x,y,id,offset:NETWORK_CONFIG.offsets[id]}));
      this.edges=NETWORK_CONFIG.edges.map(([a,b,axis,q,c,main],id)=>({a,b,axis,q,c,main,id,
        length:Math.hypot(this.nodes[a].x-this.nodes[b].x,this.nodes[a].y-this.nodes[b].y)}));}
  }
  class SignalConfiguration {
    constructor(values=INITIAL_STATE){this.values=values.slice();this.validate();}
    validate(){assert(this.values.length===INITIAL_STATE.length && this.values.every(s=>Number.isFinite(s)&&s>=CONFIG.minSignal&&s<=CONFIG.maxSignal),'Invalid signal configuration');}
    propose(rng,amplitude){const i=Math.floor(rng.next()*this.values.length),values=this.values.slice();
      // Reflect the symmetric uniform step at bounds. Clipping would add boundary mass.
      let s=values[i]+(2*rng.next()-1)*amplitude;
      while(s<CONFIG.minSignal || s>CONFIG.maxSignal){if(s<CONFIG.minSignal)s=2*CONFIG.minSignal-s;if(s>CONFIG.maxSignal)s=2*CONFIG.maxSignal-s;}
      values[i]=s;return {i,state:new SignalConfiguration(values)};}
  }
  class TrafficModel {
    // Cycle-averaged conceptual capacity. Fixed visual phase offsets do not enter E.
    static evaluate(network,state){return network.edges.map(e=>{
      const ga=e.axis===0?state.values[e.a]:1-state.values[e.a];
      const gb=e.axis===0?state.values[e.b]:1-state.values[e.b];
      const signalFactor=.16+.84*Math.sqrt(ga*gb),capacity=e.c*signalFactor,rho=e.q/capacity;
      // Stable softplus: smooth overload growth, no singularity at rho=1.
      const z=10*(rho-1),overload=(Math.max(z,0)+Math.log1p(Math.exp(-Math.abs(z))))/10;
      const delay=.10*rho*rho+.80*overload+3.2*overload*overload;
      assert(Number.isFinite(delay)&&capacity>0,'Non-finite conceptual delay');
      return {capacity,rho,delay};});}
  }
  class EnergyFunction {
    static evaluate(network,state){const roads=TrafficModel.evaluate(network,state);
      // w_j = q_j / sum(q); d_ref is a fixed scale, not the diagnostic search result.
      const demand=network.edges.reduce((sum,e)=>sum+e.q,0);
      const energy=roads.reduce((sum,r,j)=>sum+network.edges[j].q*r.delay,0)/demand/CONFIG.delayReference;
      assert(Number.isFinite(energy)&&energy>=0,'Invalid objective energy');
      return {roads,energy,meanDelay:roads.reduce((sum,r)=>sum+r.delay,0)/roads.length};}
  }
  class HistoryBuffer {
    constructor(capacity=1600){this.capacity=capacity;this.points=[];}
    push(point){if(this.points.length===this.capacity)this.points.shift();this.points.push(point);}
  }
  class Metrics {
    constructor(){this.accepted=0;this.rejected=0;this.uphillAccepted=0;this.uphillProposed=0;}
    get iteration(){return this.accepted+this.rejected;}
    get acceptance(){return this.iteration?this.accepted/this.iteration:null;}
    record(event){if(event.delta>0)this.uphillProposed++;if(event.accepted){this.accepted++;if(event.delta>0)this.uphillAccepted++;}else this.rejected++;}
  }
  class AnnealingEngine {
    constructor(network,temperature0,amplitude=CONFIG.proposalAmplitude){
      assert(temperature0>0&&Number.isFinite(temperature0),'T must be positive');
      this.network=network;this.temperature0=temperature0;this.amplitude=amplitude;this.rng=new PRNG(CONFIG.seed);
      this.state=new SignalConfiguration();this.result=EnergyFunction.evaluate(network,this.state);
      this.metrics=new Metrics();this.history=new HistoryBuffer();this.history.push({t:0,e:this.result.energy});
      this.events=[];this.ticks=0;this.budget=0;this.flashes=Array(network.nodes.length).fill(-10);}
    get time(){return this.ticks*CONFIG.dt;}
    get temperatureNorm(){return mix(1,CONFIG.temperatureEnd,this.time/CONFIG.duration);}
    get temperature(){return this.temperature0*this.temperatureNorm;}
    step(){if(this.ticks>=Math.round(CONFIG.duration/CONFIG.dt))return;
      this.ticks++;const t=this.time;
      if(t>2){this.budget+=CONFIG.proposalRate*CONFIG.dt*(1-.65*smooth(12.5,14,t));
        while(this.budget>=1-1e-10){this.budget-=1;this.propose();}}
    }
    propose(){const previous=this.result.energy,proposal=this.state.propose(this.rng,this.amplitude);
      const candidate=EnergyFunction.evaluate(this.network,proposal.state),delta=candidate.energy-previous;
      const probability=delta<=0?1:Math.exp(-delta/this.temperature),u=this.rng.next(),accepted=u<probability;
      assert(Number.isFinite(probability)&&probability>=0&&probability<=1,'Invalid Metropolis probability');
      if(accepted){this.state=proposal.state;this.result=candidate;this.flashes[proposal.i]=this.time;}
      const event={t:this.time,i:proposal.i,delta,probability,u,accepted,before:previous,after:this.result.energy,temperature:this.temperature};
      this.metrics.record(event);this.events.push(event);this.history.push({t:this.time,e:this.result.energy});}
    run(){while(this.time<CONFIG.duration-1e-9)this.step();return this;}
  }
  // Reference search is diagnostic only; it never replaces a state in the displayed chain.
  function findReference(network){let state=new SignalConfiguration(),best=EnergyFunction.evaluate(network,state).energy;
    for(let pass=0;pass<4;pass++)for(let i=0;i<state.values.length;i++){
      let next=state;for(let k=0;k<=30;k++){const values=state.values.slice();values[i]=mix(CONFIG.minSignal,CONFIG.maxSignal,k/30);
        const candidate=new SignalConfiguration(values),energy=EnergyFunction.evaluate(network,candidate).energy;
        if(energy<best){best=energy;next=candidate;}}state=next;}
    return best;}
  function summarize(engine,reference){const energies=engine.history.points.map(p=>p.e),initial=energies[0];
    return {temperature0:engine.temperature0,amplitude:engine.amplitude,acceptance:engine.metrics.acceptance,
      uphill:engine.metrics.uphillAccepted,initial,final:engine.result.energy,min:Math.min(...energies),max:Math.max(...energies),reference,
      oscillation:(Math.max(...energies)-Math.min(...energies))/initial,
      initialHigh:initial/reference,finalHigh:engine.result.energy/reference,iterations:engine.metrics.iteration};}
  function calibrate(network){const reference=findReference(network),trials=[];
    for(const amplitude of [.10,.12,.15])for(const temperature of [.006,.010,.016,.024,.036,.055,.080]){
      const engine=new AnnealingEngine(network,temperature/CONFIG.delayReference,amplitude).run(),r=summarize(engine,reference);
      r.valid=r.acceptance>=.65&&r.acceptance<=.89&&r.uphill>=25&&r.initialHigh>1.18&&r.min/reference>1.12&&r.final/r.initial>.85&&r.oscillation>.12;
      r.score=Math.abs(r.acceptance-.81)+Math.abs(r.final/r.initial-1)*.18;
      trials.push(r);}
    const chosen=trials.filter(r=>r.valid).sort((a,b)=>a.score-b.score)[0];
    assert(chosen,'Calibration failed: no valid high-T trajectory');
    return Object.freeze(chosen);}
  // Independent audit layer: never consumes the displayed engine's RNG, changes
  // a state, or changes the original calibration, proposal and acceptance rules.
  const segmentDiagnostic=result=>result.meanDelay/CONFIG.delayReference;
  function validateExperiment(engine,calibration){
    const tol=1e-12,checks=new Set(),n=engine.network;
    const check=(ok,label)=>{assert(ok,'VALIDATION FAILED: '+label);checks.add(label);};
    const close=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<tol;
    check(n.nodes.length===16&&n.edges.length===26&&INITIAL_STATE.length===16,'Canonical dimensions');
    check(CONFIG.minSignal===.20&&CONFIG.maxSignal===.80&&CONFIG.delayReference===.25,'Canonical bounds and normalization');
    check(n.nodes.every((r,i)=>r.x===NETWORK_CONFIG.nodes[i][0]&&r.y===NETWORK_CONFIG.nodes[i][1]&&r.offset===NETWORK_CONFIG.offsets[i]),'Canonical coordinates and offsets');
    check(n.edges.every((r,i)=>['a','b','axis','q','c','main'].every((key,k)=>r[key]===NETWORK_CONFIG.edges[i][k])&&r.q>0&&r.c>0),'Canonical links, demands and capacities');
    const demand=n.edges.reduce((sum,r)=>sum+r.q,0),weights=n.edges.map(r=>r.q/demand),sumWeights=weights.reduce((sum,w)=>sum+w,0);
    check(close(sumWeights,1),'Sum of demand weights equals one');
    let maxObjectiveError=0,maxDiagnosticError=0,evaluatedStates=0;
    function auditState(state,result){
      check(state.values.length===16&&state.values.every(s=>Number.isFinite(s)&&s>=.20&&s<=.80),'Finite bounded signal state');
      check(result.roads.length===26&&result.roads.every(r=>r.capacity>0&&Number.isFinite(r.capacity)&&Number.isFinite(r.rho)&&r.delay>=0&&Number.isFinite(r.delay)),'Positive capacities and finite nonnegative delays');
      // Sum normalized weights independently instead of repeating E's numerator.
      let weighted=0,plain=0;
      for(let j=0;j<n.edges.length;j++){weighted+=weights[j]*result.roads[j].delay;plain+=result.roads[j].delay;}
      const energyCheck=weighted/CONFIG.delayReference,meanCheck=plain/n.edges.length;
      const diagnosticCheck=meanCheck/CONFIG.delayReference;
      maxObjectiveError=Math.max(maxObjectiveError,Math.abs(energyCheck-result.energy));
      maxDiagnosticError=Math.max(maxDiagnosticError,Math.abs(diagnosticCheck-segmentDiagnostic(result)));
      check(result.energy>=0&&close(energyCheck,result.energy),'Independent weighted objective matches E');
      check(close(meanCheck,result.meanDelay)&&close(diagnosticCheck,segmentDiagnostic(result)),'Simple segment diagnostic matches meanDelay / d_ref');
      evaluatedStates++;
    }
    check(engine.time===CONFIG.duration&&engine.amplitude===calibration.amplitude&&engine.temperature0===calibration.temperature0,'Completed calibrated high-T trajectory');
    let state=new SignalConfiguration(),result=EnergyFunction.evaluate(n,state),lastTime=0,accepted=0,rejected=0,uphill=0,uphillProposed=0;
    const rng=new PRNG(CONFIG.seed);auditState(state,result);
    check(engine.history.points.length===engine.events.length+1,'Complete energy history');
    check(engine.history.points[0].t===0&&close(engine.history.points[0].e,result.energy),'Initial history entry');
    for(let k=0;k<engine.events.length;k++){
      const event=engine.events[k],proposal=state.propose(rng,engine.amplitude);
      const candidate=EnergyFunction.evaluate(n,proposal.state),u=rng.next();auditState(proposal.state,candidate);
      const changed=state.values.map((s,i)=>s===proposal.state.values[i]?-1:i).filter(i=>i>=0);
      check(changed.length===1&&changed[0]===proposal.i&&event.i===proposal.i,'Single component proposal');
      check(event.t>lastTime&&event.t>2&&event.t<=CONFIG.duration,'Ordered proposal times');lastTime=event.t;
      const temperature=engine.temperature0*(1+(CONFIG.temperatureEnd-1)*event.t/CONFIG.duration);
      const delta=candidate.energy-result.energy,probability=delta<=0?1:Math.exp(-delta/temperature),take=u<probability;
      check(close(event.before,result.energy)&&close(event.delta,delta),'Delta equals candidate energy minus previous energy');
      check(temperature>0&&close(event.temperature,temperature)&&close(event.probability,probability),'Actual temperature and Metropolis probability');
      check(event.u===u&&u>=0&&u<1&&event.accepted===take,'Exact PRNG replay and unrounded acceptance decision');
      if(delta>0)uphillProposed++;
      if(take){accepted++;if(delta>0)uphill++;state=proposal.state;result=candidate;}else rejected++;
      check(close(event.after,result.energy),'Accepted candidate or preserved previous state');
      const point=engine.history.points[k+1];check(point.t===event.t&&close(point.e,result.energy),'Recorded history matches actual decisions');
    }
    auditState(engine.state,engine.result);
    check(state.values.every((s,i)=>s===engine.state.values[i])&&close(result.energy,engine.result.energy),'Final state equals replay');
    check(result.roads.every((r,j)=>Object.keys(r).every(key=>close(r[key],engine.result.roads[j][key]))),'Final road metrics equal replay');
    // These probes distinguish reflection from clipping without changing the RNG.
    for(const [bound,draw,expected] of [[.20,0,.32],[.80,1,.68]]){
      const values=INITIAL_STATE.slice();values[0]=bound;let calls=0;
      const p=new SignalConfiguration(values).propose({next:()=>calls++===0?0:draw},.12);
      check(p.i===0&&close(p.state.values[0],expected)&&p.state.values.slice(1).every((s,i)=>s===values[i+1]),'Reflected boundary probe '+bound);
    }
    const m=engine.metrics,acceptance=accepted/(accepted+rejected),summary=summarize(engine,calibration.reference);
    check(m.accepted===accepted&&m.rejected===rejected&&m.uphillAccepted===uphill&&m.uphillProposed===uphillProposed&&close(m.acceptance,acceptance),'Measured acceptance counters');
    check(acceptance>=.65&&acceptance<=.89&&uphill>=25&&summary.initialHigh>1.18&&summary.min/calibration.reference>1.12&&summary.final/summary.initial>.85&&summary.oscillation>.12,'Original high-T calibration criteria');
    check(engine.events.some(e=>e.after>e.before)&&engine.events.some(e=>e.after<e.before),'Nonmonotonic energy; genuine uphill and downhill visits');
    check(['temperature0','amplitude','acceptance','uphill','initial','final','min','max','iterations'].every(key=>close(summary[key],calibration[key])),'Calibration statistics match displayed trajectory');
    return deepFreeze({status:'PASS',seed:CONFIG.seed,tolerance:tol,checks:[...checks],
      model:{nodes:16,links:26,stateDimension:16,bounds:[.20,.80],delayReference:.25,energyFormula:'E = sum(w_j*d_j) / d_ref; w_j = q_j / sum(q)',sumWeights},
      objective:{status:'PASS',evaluatedStates,maxObjectiveError,maxDiagnosticError},
      trajectory:{status:'PASS',iterations:engine.events.length,accepted,rejected,acceptance,uphillAccepted:uphill,uphillProposed,nonmonotonic:true,temperature0:engine.temperature0,temperatureFinal:engine.temperature},

<script id="presentation-common">/* Presentation only: no proposal, random draw, energy or acceptance is computed here. */
const VideoPresentation = (() => {

 function chart(ctx,points,{x=1230,y=685,w=594,h=180,duration=16,best=true,highlight='',max=1.1}={}){

  if(showTest)label(ctx,decision===null?(u<P?'u < P':'u ≥ P'):(decision?'✓ ACEITAR':'× REJEITAR'),x+w/2,y+215,36,decision===null?C.text:decision?C.green:C.red,'center');

 }
 function commonContract(spec,frames){
  const checks=[];const check=(ok,label)=>{checks.push({label,pass:!!ok});};
  check(document.documentElement.lang==='pt-BR','Idioma da apresentação: português');
  check(document.querySelectorAll('#scene').length===1,'Um único Canvas de apresentação');
  check(!document.querySelector('script[src],link[rel="stylesheet"]'),'Sem bibliotecas ou folhas externas');
  check(frames.every(f=>!/(URBAN NETWORK|INITIAL STATE|HIGH.T EXPLORATION|ACCEPTANCE RATE|CURRENT ENERGY|BEST ENERGY FOUND|RUNNING MINIMUM)/.test([f.title,f.subtitle,f.panel,f.center,f.caption].join(' '))),'Conceitos visíveis em português');
  check(frames.every(f=>(f.graphs||0)<=1&&(f.pair||(f.importantNumbers||0)<=3)),'Até um gráfico e três números principais; exceção explícita para a comparação pareada');
  const styles=[...document.styleSheets].flatMap(s=>[...s.cssRules].map(r=>r.cssText)).join('\n');
  check(styles.includes('.recording #controls')&&styles.includes('display: none !important'),'Controles ocultos no modo de gravação');
  check(styles.includes('cursor: none !important'),'Cursor oculto em toda a gravação');
  check(frames.every(f=>!/(ÓTIMO GLOBAL|SOLUÇÃO ÓTIMA|MELHOR CONFIGURAÇÃO POSSÍVEL)/.test([f.title,f.panel,f.center].join(' '))),'Sem promessa de ótimo global');
  return checks;
 }
 function mount(spec){
  const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),canvas=$('scene'),ctx=canvas.getContext('2d');
  let recording=params.get('recording')!=='0',time=clamp(Number(params.get('t'))||0,0,spec.duration),running=params.has('autoplay')?params.get('autoplay')==='1':recording,last=performance.now(),lastPhase='',lastHUD=-Infinity;
  const setRecording=v=>{recording=v;document.body.classList.toggle('recording',v);$('controls').inert=v;$('debug').hidden=true;$('inspect').setAttribute('aria-expanded','false');};
  setRecording(recording);$('seek').max=spec.duration;

<script id="presentation">(() => {
 'use strict';
 const S=Simulation02,V=VideoPresentation,{C,fmt,metric,concept,detail,note,eyebrow}=V;
 const network=new S.UrbanNetwork(),calibration=S.calibrate(network),engine=new S.AnnealingEngine(network,calibration.temperature0,calibration.amplitude),frames=[];
 const capture=()=>frames.push({state:engine.state,result:engine.result,t:engine.time,historyLength:engine.history.points.length});
 capture();while(engine.time<S.CONFIG.duration-1e-9){engine.step();capture();}

 const phases=[
  [0,'A pergunta'],[3,'A rede'],[5.8,'As vias'],[8.6,'As cores'],[11.4,'O fluxo ilustrativo'],
  [14.2,'Um semáforo'],[20,'A configuração'],[24,'O estado x'],[28,'Como comparar'],
  [32,'O custo'],[36,'Menor custo'],[40,'A função de custo'],[45,'Exploração com T alta'],
  [61,'Aceitar apenas melhorias?'],[65,'Busca gulosa'],[69,'Mínimos locais']
 ].map(([start,name])=>({start,name}));
 const duration=73,title='O QUE O COMPUTADOR ESTÁ TENTANDO MELHORAR?';
 function at(t){
  const p=V.phaseAt(phases,t),i=phases.indexOf(p),f={title,phase:i,importantNumbers:0,graphs:0,scientificTime:0,focus:-1,opacity:1};
  f.scientificTime=t<45?0:Math.min(14,(t-45)*14/16);f.sample=frames[Math.min(frames.length-1,Math.floor(f.scientificTime/S.CONFIG.dt+1e-9))];
  f.caption='';
  if(i===0){f.opacity=.17;f.center=concept('Cada semáforo pode mudar.<br>O que torna uma configuração melhor?');}
  if(i>=1&&i<=4){f.title='REDE URBANA SIMPLIFICADA';
   const texts=[['INTERSEÇÃO / SEMÁFORO','Cada ponto conecta as vias.'],['VIA','Cada ligação representa<br>um trecho da rede.'],['COR DA VIA','Indica o atraso no modelo.'],['FLUXO ILUSTRATIVO','Os pontos ajudam a visualizar o fluxo.<br>Não são veículos simulados.']];
   f.panel=eyebrow('COMO LER A REDE')+concept(texts[i-1][0])+detail(texts[i-1][1]);if(i===1)f.focus=6;

  }
  if(i===5){const g=S.INITIAL_STATE[6];f.title='UMA ESCOLHA EM CADA SEMÁFORO';f.focus=6;f.importantNumbers=2;
   f.panel=eyebrow('INTERSEÇÃO 07')+concept('TEMPO DE VERDE')+metric('DIREÇÃO PRINCIPAL',fmt(g*100,0)+'%','green')+metric('DIREÇÃO TRANSVERSAL',fmt((1-g)*100,0)+'%','purple')+note('Frações complementares do mesmo ciclo.');}
  if(i===6){f.title='JUNTAMOS TODAS AS ESCOLHAS';f.panel=concept('UMA CONFIGURAÇÃO<br>COMPLETA DA REDE')+detail('Chamamos essa combinação<br>de <span class="cyan">estado x</span>.');}
  if(i===7){f.title='CADA CONFIGURAÇÃO É UM ESTADO';f.panel=eyebrow('ESTADO x')+`<div class="formula mono cyan">x = (g₁, g₂, …, g₁₆)</div>`+detail('Cada g representa a fração de verde<br>de um semáforo.');}
  if(i===8){f.opacity=.17;f.title='COMO SABER SE UMA CONFIGURAÇÃO É BOA?';f.center=concept('Precisamos comparar<br>as configurações.');}
  if(i===9){f.title='ASSOCIAMOS UM CUSTO A CADA ESTADO';f.panel=concept('UM ESTADO x<br>UM CUSTO E(x)')+metric('CUSTO DESTA CONFIGURAÇÃO',fmt(f.sample.result.energy))+note('Custo adimensional do modelo.');f.importantNumbers=1;}
  if(i===10){f.title='O COMPUTADOR TENTA REDUZIR ESSE CUSTO';f.panel=concept('MENOR E', 'cyan')+detail('↓')+concept('MENOR CUSTO AGREGADO<br>NO MODELO');}
  if(i===11){f.title='CADA VIA CONTRIBUI PARA O CUSTO';f.panel=concept('VIAS COM MAIOR DEMANDA<br>TÊM MAIOR PESO')+`<p class="formula mono">E(x) = Σⱼ wⱼ dⱼ(x) / d<sub>ref</sub></p>`+note('wⱼ = qⱼ / Σₖ qₖ · pesos normalizados<br>dⱼ(x): atraso na via · d_ref: escala fixa');}

   f.panel=eyebrow('EXPLORAÇÃO')+concept('O CUSTO PODE SUBIR<br>E DESCER')+metric('CUSTO ATUAL E(x)',fmt(f.sample.result.energy))+note('T é um parâmetro do algoritmo.<br>Não é a temperatura das ruas.');f.caption='<b>Cada mudança aceita produz uma nova configuração.</b>';
  }

  f.accessible=[f.title,(f.panel||f.center||'').replace(/<[^>]+>/g,' ')].join('. ');return f;
 }
 function draw(ctx,f,t){
  const points=V.map(ctx,network,f.sample.state,f.sample.result,f.scientificTime||t,{focus:f.focus,opacity:f.opacity});

  if(f.phase===12)V.chart(ctx,engine.history.points.slice(0,f.sample.historyLength),{duration:14,best:false,max:summary.max*1.1,y:684});

 }
 const presentationValidation=validatePresentationContract();

 const exportData=()=>({seed:S.CONFIG.seed,network:S.NETWORK_CONFIG,initialState:S.INITIAL_STATE,calibration,summary,finalState:engine.state.values,events:engine.events,history:engine.history.points,validation:scienceValidation,presentationValidation});
 window.validatePresentationContract=validatePresentationContract;
 V.mount({duration,title,phases,at,draw,presentationValidation,scienceValidation,export:exportData,filename:'simulacao-02',api:'Simulation02Experiment',alias:'UrbanSimulation',events:engine.events,history:engine.history.points});
})();
