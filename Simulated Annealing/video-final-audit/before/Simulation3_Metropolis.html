<script id="model">
const Simulation03Core = (() => {
 'use strict';
 const AUTO_PLAY=false, RECORDING_MODE=true, RANDOM_SEED=20260913;
 const CONFIG=Object.freeze({width:1920,height:1080,duration:55,dt:1/120,hudRate:15,
  proposalAmplitude:.12,minSignal:.20,maxSignal:.80,delayReference:.25,cycle:4.8,
  temperatureHigh:.096,seed:RANDOM_SEED,maxCandidates:512,minDownhill:.005,minUphill:.0001,
  probabilityMin:.20,probabilityMax:.85,lowProbabilityMax:.10,
  seeds:Object.freeze([RANDOM_SEED,20260917,20261003,31415926]),divisors:Object.freeze([2,4,8,16])});
 // T_high is the audited temperatureInitial in Simulation4_Convergence.html.
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const mix=(a,b,t)=>a+(b-a)*t;
 const assert=(ok,message)=>{if(!ok)throw new Error(message);};
 const deepFreeze=o=>{Object.values(o).forEach(v=>{if(v&&typeof v==='object')deepFreeze(v);});return Object.freeze(o);};
  // Geometry is explicit, synthetic and not georeferenced. Keep this schema for scene 04.
  const NETWORK_CONFIG = deepFreeze({version:1, geometrySeed:20260912,
    nodes:[[110,104],[366,72],[664,116],[977,94],[146,260],[426,245],[720,277],[1040,231],
      [88,434],[337,409],[652,443],[993,411],[194,596],[448,574],[770,614],[1064,564]],
    // a,b,axis (0=main / 1=cross), relative demand, base capacity, main corridor
    edges:[[0,1,0,.49,.91,1],[1,2,0,.51,.92,1],[2,3,0,.48,.90,1],
      [4,5,0,.57,.96,1],[5,6,0,.58,.94,1],[6,7,0,.54,.95,1],
      [8,9,0,.53,.93,1],[9,10,0,.55,.94,1],[10,11,0,.52,.94,1],
      [12,13,0,.47,.93,0],[13,14,0,.48,.95,0],[14,15,0,.46,.92,0],
      [0,4,1,.38,.78,0],[4,8,1,.40,.78,0],[8,12,1,.25,.83,0],
      [1,5,1,.42,.79,0],[5,9,1,.41,.79,0],[9,13,1,.39,.80,0],
      [2,6,1,.41,.77,0],[6,10,1,.42,.80,0],[10,14,1,.39,.80,0],
      [3,7,1,.26,.83,0],[7,11,1,.40,.80,0],[11,15,1,.24,.82,0],
      [1,4,1,.38,.82,0],[10,15,0,.40,.89,0]],
    offsets:[.07,.64,.26,.82,.41,.92,.16,.56,.77,.31,.95,.11,.52,.03,.69,.38]});
  const INITIAL_STATE = deepFreeze([.39,.51,.34,.48,.42,.30,.43,.36,.35,.49,.38,.46,.47,.33,.50,.41]);
  class PRNG {
    constructor(seed){this.state=seed>>>0;}
    next(){let t=this.state=(this.state+0x6D2B79F5)>>>0;t=Math.imul(t^(t>>>15),t|1);
      t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;}
  }
  class UrbanNetwork {
    constructor(){this.nodes=NETWORK_CONFIG.nodes.map(([x,y],id)=>({x,y,id,offset:NETWORK_CONFIG.offsets[id]}));
      this.edges=NETWORK_CONFIG.edges.map(([a,b,axis,q,c,main],id)=>({a,b,axis,q,c,main,id,
        length:Math.hypot(this.nodes[a].x-this.nodes[b].x,this.nodes[a].y-this.nodes[b].y)}));}
  }
  class SignalConfiguration {
    constructor(values=INITIAL_STATE){this.values=values.slice();this.validate();}
    validate(){assert(this.values.length===INITIAL_STATE.length && this.values.every(s=>Number.isFinite(s)&&s>=CONFIG.minSignal&&s<=CONFIG.maxSignal),'Invalid signal configuration');}
    propose(rng,amplitude){const i=Math.floor(rng.next()*this.values.length),values=this.values.slice();
      // Reflect the symmetric uniform step at bounds. Clipping would add boundary mass.
      let s=values[i]+(2*rng.next()-1)*amplitude;
      while(s<CONFIG.minSignal || s>CONFIG.maxSignal){if(s<CONFIG.minSignal)s=2*CONFIG.minSignal-s;if(s>CONFIG.maxSignal)s=2*CONFIG.maxSignal-s;}
      values[i]=s;return {i,state:new SignalConfiguration(values)};}
  }
  class TrafficModel {
    // Cycle-averaged conceptual capacity. Fixed visual phase offsets do not enter E.
    static evaluate(network,state){return network.edges.map(e=>{
      const ga=e.axis===0?state.values[e.a]:1-state.values[e.a];
      const gb=e.axis===0?state.values[e.b]:1-state.values[e.b];
      const signalFactor=.16+.84*Math.sqrt(ga*gb),capacity=e.c*signalFactor,rho=e.q/capacity;
      // Stable softplus: smooth overload growth, no singularity at rho=1.
      const z=10*(rho-1),overload=(Math.max(z,0)+Math.log1p(Math.exp(-Math.abs(z))))/10;
      const delay=.10*rho*rho+.80*overload+3.2*overload*overload;
      assert(Number.isFinite(delay)&&capacity>0,'Non-finite conceptual delay');
      return {capacity,rho,delay};});}
  }
  class EnergyFunction {
    static evaluate(network,state){const roads=TrafficModel.evaluate(network,state);
      // w_j = q_j / sum(q); d_ref is a fixed scale, not the diagnostic search result.
      const demand=network.edges.reduce((sum,e)=>sum+e.q,0);
      const energy=roads.reduce((sum,r,j)=>sum+network.edges[j].q*r.delay,0)/demand/CONFIG.delayReference;
      assert(Number.isFinite(energy)&&energy>=0,'Invalid objective energy');
      return {roads,energy,meanDelay:roads.reduce((sum,r)=>sum+r.delay,0)/roads.length};}
  }

 const TIMELINE=deepFreeze([
  {id:'rule',start:0,end:4,label:'RULE'},
  {id:'A',start:4,end:11,label:'DOWNHILL'},
  {id:'setup',start:11,end:14,label:'UPHILL TEST'},
  {id:'high',start:14,end:25,label:'HIGH T'},
  {id:'low',start:25,end:37,label:'LOWER T'},
  {id:'pair',start:37,end:49,label:'COMPARE'},
  {id:'bridge',start:49,end:55,label:'NEXT: COOLING'}]);
 const probability=(delta,T)=>delta<=0?1:Math.exp(-delta/T);
 const decide=(delta,T,u)=>{const p=probability(delta,T);return {temperature:T,probability:p,accepted:delta<=0||u<p};};
 function buildTeachingExperiment(){
  const network=new UrbanNetwork(),base=new SignalConfiguration(),current=EnergyFunction.evaluate(network,base),trials=[];
  // Independent proposals from INITIAL_STATE, not an annealing trajectory.
  // First qualifying A and paired B/C in the first successful seed. Selection is
  // pedagogical, NOT an unbiased sample or an estimate of an acceptance rate.
  for(const seed of CONFIG.seeds){
   const rng=new PRNG(seed);let caseA=null,pairedUphill=null;
   for(let attempt=1;attempt<=CONFIG.maxCandidates;attempt++){
    const rngBefore=rng.state,proposal=base.propose(rng,CONFIG.proposalAmplitude);
    const candidate=EnergyFunction.evaluate(network,proposal.state),delta=candidate.energy-current.energy;
    // Exactly one fresh draw per candidate, never adjusted to force a decision.
    const sampledU=rng.next();
    const event={seed,attempt,rngBefore,index:proposal.i,intersection:proposal.i+1,
     beforeValue:base.values[proposal.i],afterValue:proposal.state.values[proposal.i],
     deltaParameter:proposal.state.values[proposal.i]-base.values[proposal.i],
     currentState:base.values.slice(),candidateState:proposal.state.values.slice(),
     currentEnergy:current.energy,candidateEnergy:candidate.energy,delta,currentResult:current,candidateResult:candidate};
    // Require a visible cost decrease; still select the first qualifying proposal.
    if(!caseA&&delta<-CONFIG.minDownhill)caseA={...event,u:null,...decide(delta,null,null)};
    if(!pairedUphill&&delta>CONFIG.minUphill){
     const high=decide(delta,CONFIG.temperatureHigh,sampledU);
     if(high.probability>=CONFIG.probabilityMin&&high.probability<=CONFIG.probabilityMax){
      for(const divisor of CONFIG.divisors){
       const low=decide(delta,CONFIG.temperatureHigh/divisor,sampledU);
       if(low.probability<=CONFIG.lowProbabilityMax&&low.probability<sampledU&&sampledU<high.probability){
        // B/C reuse the SAME event and u only to isolate T in this controlled
        // comparison. Ordinary successive Metropolis steps use fresh draws.
        pairedUphill={...event,u:sampledU,divisor,high,low};break;
       }
      }
     }
    }
    if(caseA&&pairedUphill){trials.push({seed,candidates:attempt,selected:true});
     const experiment={seed,network,caseA,pairedUphill,trials,selection:'First valid teaching example; independent proposals from INITIAL_STATE; paired random draw, not an unbiased trajectory.'};
     experiment.validation=validateTeachingEvents(experiment);return deepFreeze(experiment);
    }
   }
   trials.push({seed,candidates:CONFIG.maxCandidates,selected:false});
  }
  throw new Error('Nenhuma experiência válida no orçamento de '+CONFIG.seeds.length*CONFIG.maxCandidates+' candidatos.');
 }
 function caseViews(e){return [{id:'A',event:e.caseA,decision:e.caseA},
  {id:'B',event:e.pairedUphill,decision:e.pairedUphill.high},
  {id:'C',event:e.pairedUphill,decision:e.pairedUphill.low}];}
 function validateTeachingEvents(e){
  const checks=[],tol=1e-12,close=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<=tol;
  const check=(ok,label)=>{assert(ok,'VALIDATION FAILED: '+label);checks.push(label);};
  const n=e.network,total=n.edges.reduce((s,r)=>s+r.q,0),a=e.caseA,p=e.pairedUphill;
  check(n.nodes.length===16&&n.edges.length===26,'16 nodes / 26 links');
  check(CONFIG.minSignal===.20&&CONFIG.maxSignal===.80&&CONFIG.delayReference===.25,'Canonical bounds and delay reference');
  check(n.nodes.every((r,i)=>r.x===NETWORK_CONFIG.nodes[i][0]&&r.y===NETWORK_CONFIG.nodes[i][1]&&r.offset===NETWORK_CONFIG.offsets[i]),'Canonical coordinates and visual offsets');
  check(n.edges.every((r,i)=>['a','b','axis','q','c','main'].every((k,j)=>r[k]===NETWORK_CONFIG.edges[i][j])&&r.q>0&&r.c>0),'Canonical topology, demands and capacities');
  check(close(n.edges.reduce((s,r)=>s+r.q/total,0),1),'Normalized weights sum to one');
  for(const [name,v] of [['A',a],['B/C',p]]){
   check(v.currentState.length===16&&v.candidateState.length===16,'State dimensions '+name);
   check(v.currentState.every((g,i)=>g===INITIAL_STATE[i]),'Canonical baseline '+name);
   for(const [key,state] of [['current',v.currentState],['candidate',v.candidateState]]){
    check(state.every(g=>Number.isFinite(g)&&g>=.20&&g<=.80),'Bounded state '+name+' '+key);
    const result=EnergyFunction.evaluate(n,new SignalConfiguration(state)),stored=v[key+'Result'];
    check(result.energy>=0&&close(result.energy,v[key+'Energy'])&&close(result.energy,stored.energy),'Recomputed energy '+name+' '+key);
    check(result.roads.every((r,j)=>r.capacity>0&&r.delay>=0&&Object.keys(r).every(k=>close(r[k],stored.roads[j][k]))),'Finite canonical road results '+name+' '+key);
   }
   check(close(v.delta,v.candidateEnergy-v.currentEnergy),'Energy difference '+name);
   const changed=v.currentState.map((g,i)=>g===v.candidateState[i]?-1:i).filter(i=>i>=0);
   check(changed.length===1&&changed[0]===v.index&&v.intersection===v.index+1,'Single component proposal '+name);
   check(v.beforeValue===v.currentState[v.index]&&v.afterValue===v.candidateState[v.index]&&close(v.deltaParameter,v.afterValue-v.beforeValue),'Recorded parameter change '+name);
   const replay=new PRNG(v.rngBefore),proposal=new SignalConfiguration(v.currentState).propose(replay,CONFIG.proposalAmplitude),u=replay.next();
   check(proposal.i===v.index&&proposal.state.values.every((g,i)=>g===v.candidateState[i]),'Exact reflected proposal replay '+name);
   if(name==='B/C')check(u===v.u,'Exact PRNG draw replay');
  }
  // Boundary probes exercise reflection (a clipped proposal would return a bound).
  for(const [g,draw,expected] of [[.20,0,.32],[.80,1,.68]]){
   let calls=0;const values=INITIAL_STATE.slice();values[0]=g;
   const result=new SignalConfiguration(values).propose({next:()=>calls++===0?0:draw},.12);
   check(close(result.state.values[0],expected),'Reflect boundary '+g);
  }
  check(a.delta<-CONFIG.minDownhill&&a.probability===1&&a.accepted===true&&a.u===null,'A downhill accepted directly');
  check(p.delta>CONFIG.minUphill&&p.u>=0&&p.u<1,'Positive paired delta and uniform draw bounds');
  for(const key of ['high','low']){const d=p[key];
   check(d.temperature>0&&d.probability>=0&&d.probability<1&&close(d.probability,Math.exp(-p.delta/d.temperature)),'Metropolis formula '+key);
   check(d.accepted===(p.u<d.probability),'Unrounded decision '+key);
  }
  const views=caseViews(e),b=views[1].event,c=views[2].event;
  check(b===c&&b.currentState===c.currentState&&b.candidateState===c.candidateState,'B/C share same current state and proposal');
  check(b.currentEnergy===c.currentEnergy&&b.candidateEnergy===c.candidateEnergy&&b.delta===c.delta&&b.u===c.u,'B/C share same energies, delta and u');
  check(p.high.temperature===CONFIG.temperatureHigh&&p.low.temperature===CONFIG.temperatureHigh/p.divisor&&CONFIG.divisors.includes(p.divisor),'Temperatures from audited high T and defined grid');
  check(p.high.temperature>p.low.temperature&&p.high.probability>p.low.probability,'Higher T increases uphill probability');
  check(p.low.probability<p.u&&p.u<p.high.probability&&p.high.accepted&&!p.low.accepted,'P_low < u < P_high; B accepted; C rejected');
  check(p.high.probability>=CONFIG.probabilityMin&&p.high.probability<=CONFIG.probabilityMax&&p.low.probability<=CONFIG.lowProbabilityMax,'Teaching selection thresholds');
  return {status:'PASS',tolerance:tol,checks,model:'Simulation2_UrbanLattice.html',temperatureSource:'Simulation4_Convergence.html: temperatureInitial = 0.096'};
 }
 return Object.freeze({AUTO_PLAY,RECORDING_MODE,CONFIG,TIMELINE,NETWORK_CONFIG,INITIAL_STATE,PRNG,UrbanNetwork,SignalConfiguration,TrafficModel,EnergyFunction,buildTeachingExperiment,validateTeachingEvents,caseViews,probability,decide,clamp,mix});
})();
</script>
<script id="presentation-common">/* Presentation only: no proposal, random draw, energy or acceptance is computed here. */
const VideoPresentation = (() => {
 'use strict';
 const C={bg:'#0f111a',text:'#f8f8f2',muted:'#9da8bd',cyan:'#8be9fd',purple:'#bd93f9',green:'#50fa7b',orange:'#ffb86c',red:'#ff6868'};
 const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
 const fmt=(v,n=3)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:n,maximumFractionDigits:n});
 const signed=(v,n=3)=>(v>0?'+':'')+fmt(v,n);
 const metric=(label,value,color='cyan')=>`<div class="metric"><div class="metric-label">${label}</div><div class="value ${color}">${value}</div></div>`;
 const concept=(text,color='')=>`<h2 class="concept ${color}">${text}</h2>`;
 const detail=text=>`<p class="detail">${text}</p>`;
 const note=text=>`<p class="note">${text}</p>`;
 const eyebrow=text=>`<div class="eyebrow">${text}</div>`;
 const phaseAt=(phases,t)=>phases.findLast(p=>t>=p.start)||phases[0];
 const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
 function delayColor(d){const stops=[[.04,C.cyan],[.09,C.green],[.13,C.orange],[.28,C.red]];let k=1;while(k<3&&d>stops[k][0])k++;const [a,ca]=stops[k-1],[b,cb]=stops[k],f=clamp((d-a)/(b-a)),aa=rgb(ca),bb=rgb(cb);return `rgb(${aa.map((v,i)=>Math.round(lerp(v,bb[i],f))).join(',')})`;}
 function label(ctx,text,x,y,size=22,color=C.muted,align='left'){ctx.fillStyle=color;ctx.font=`${size}px Arial`;ctx.textAlign=align;ctx.fillText(text,x,y);ctx.textAlign='left';}
 function line(ctx,x1,y1,x2,y2,color,width=2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
 function dot(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
